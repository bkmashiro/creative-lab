<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#058 Space Filling Curves — creative-lab</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#04080f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#cdd8e8}
canvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0}
#ui{position:fixed;top:16px;left:16px;z-index:10;background:rgba(4,8,20,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(80,180,255,0.14);border-radius:13px;padding:14px 16px;min-width:256px;font-size:0.82rem}
h1{font-size:0.68rem;letter-spacing:0.15em;text-transform:uppercase;color:#44aaff;margin-bottom:10px}
.section{font-size:0.60rem;letter-spacing:0.11em;text-transform:uppercase;color:#1a5088;margin:10px 0 5px;border-top:1px solid rgba(60,140,255,0.08);padding-top:8px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.row label{width:88px;color:#4a7aaa;flex-shrink:0;font-size:0.76rem}
.row input[type=range]{flex:1;accent-color:#44aaff;cursor:pointer}
.val{width:40px;text-align:right;color:#44aaff;font-size:0.73rem;font-variant-numeric:tabular-nums}
.preset-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.preset-row button{flex:1;min-width:60px;background:rgba(44,130,255,0.07);border:1px solid rgba(44,130,255,0.18);color:#44aaff;border-radius:7px;padding:5px 4px;font-size:0.70rem;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.preset-row button:hover{background:rgba(44,130,255,0.16)}
.preset-row button.active{background:rgba(44,130,255,0.22);border-color:rgba(44,130,255,0.50);color:#80ccff}
.btn-row{display:flex;gap:5px;margin-top:8px}
button.ctrl{flex:1;background:rgba(44,130,255,0.07);border:1px solid rgba(44,130,255,0.18);color:#44aaff;border-radius:7px;padding:5px 4px;font-size:0.73rem;cursor:pointer;transition:background .15s}
button.ctrl:hover{background:rgba(44,130,255,0.16)}
button.ctrl.active{background:rgba(44,130,255,0.22);border-color:rgba(44,130,255,0.45)}
#info{position:fixed;top:16px;right:16px;z-index:10;background:rgba(4,8,20,0.88);backdrop-filter:blur(12px);border:1px solid rgba(44,130,255,0.09);border-radius:11px;padding:10px 15px;font-size:0.72rem;color:#2a5070;text-align:right;line-height:2.1}
#info span{color:#44aaff;font-variant-numeric:tabular-nums}
#progbar{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);width:200px;height:3px;background:rgba(44,130,255,0.10);border-radius:2px;overflow:hidden}
#progfill{height:100%;background:linear-gradient(90deg,#2266cc,#44aaff,#88ddff);border-radius:2px;transition:width 0.04s linear}
footer{position:fixed;bottom:12px;right:16px;color:rgba(255,255,255,0.14);font-size:0.70rem}
footer a{color:rgba(255,255,255,0.22);text-decoration:none}
footer a:hover{color:rgba(255,255,255,0.50)}
input[type=checkbox]{accent-color:#44aaff;cursor:pointer;width:13px;height:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <h1>058 · Space Filling Curves</h1>

  <div class="section">Curve Type</div>
  <div class="preset-row">
    <button class="active" data-curve="hilbert">Hilbert</button>
    <button data-curve="peano">Peano</button>
    <button data-curve="moore">Moore</button>
    <button data-curve="gosper">Gosper</button>
  </div>

  <div class="section">Parameters</div>
  <div class="row">
    <label>Order</label>
    <input type="range" id="sOrder" min="1" max="7" value="5" step="1">
    <span class="val" id="vOrder">5</span>
  </div>
  <div class="row">
    <label>Draw speed</label>
    <input type="range" id="sSpeed" min="1" max="500" value="80" step="1">
    <span class="val" id="vSpeed">80</span>
  </div>
  <div class="row">
    <label>Line width</label>
    <input type="range" id="sLine" min="0.3" max="5" value="1.2" step="0.1">
    <span class="val" id="vLine">1.2</span>
  </div>
  <div class="row">
    <label>Glow</label>
    <input type="range" id="sGlow" min="0" max="24" value="8" step="1">
    <span class="val" id="vGlow">8</span>
  </div>

  <div class="section">Style</div>
  <div class="row">
    <label>Color mode</label>
    <select id="selColor" style="flex:1;background:#060d20;color:#44aaff;border:1px solid rgba(44,130,255,0.25);border-radius:6px;padding:3px 6px;font-size:0.73rem;cursor:pointer">
      <option value="position">Position</option>
      <option value="rainbow">Rainbow</option>
      <option value="depth">Depth pulse</option>
      <option value="mono">Monochrome</option>
    </select>
  </div>
  <div class="row">
    <label>Show grid</label>
    <input type="checkbox" id="chkGrid">
  </div>
  <div class="row">
    <label>Animate loop</label>
    <input type="checkbox" id="chkLoop" checked>
  </div>

  <div class="btn-row">
    <button class="ctrl" id="btnRedraw">Redraw</button>
    <button class="ctrl" id="btnPause">Pause</button>
    <button class="ctrl" id="btnInstant">Instant</button>
  </div>
</div>

<div id="info">
  Points: <span id="iPoints">–</span><br>
  Order: <span id="iOrder">–</span><br>
  Progress: <span id="iProg">–</span>%
</div>

<div id="progbar"><div id="progfill" style="width:0%"></div></div>

<footer><a href="https://github.com/bkmashiro/creative-lab">creative-lab</a> · demo 058</footer>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
}
resize();
window.addEventListener('resize', () => { resize(); startDraw(); });

// ─── State ───────────────────────────────────────────────────────────────────
let curveType = 'hilbert';
let order = 5;
let speed = 80;
let lineW = 1.2;
let glowAmt = 8;
let colorMode = 'position';
let showGrid = false;
let loopAnim = true;
let paused = false;

let points = [];
let drawIdx = 0;
let animId = null;
let instant = false;
let loopPhase = 0; // for loop animation hue offset

// ─── Hilbert Curve ───────────────────────────────────────────────────────────
function hilbert(order) {
  const n = 1 << order; // 2^order
  const pts = [];
  for (let i = 0; i < n * n; i++) {
    let rx, ry, s, t = i;
    let x = 0, y = 0;
    for (s = 1; s < n; s <<= 1) {
      rx = 1 & (t >> 1);
      ry = 1 & (t ^ rx);
      // rotate
      if (ry === 0) {
        if (rx === 1) { x = s - 1 - x; y = s - 1 - y; }
        [x, y] = [y, x];
      }
      x += s * rx; y += s * ry;
      t >>= 2;
    }
    pts.push([x, y]);
  }
  return pts;
}

// ─── Moore Curve (variant of Hilbert visiting all 4 quadrants) ───────────────
function moore(order) {
  // Moore = 4 Hilbert curves stitched — generate by doubling grid
  const h = hilbert(order);
  const n = 1 << order;
  // Reflect / rotate to form Moore loop
  const q1 = h.map(([x,y]) => [x + n, y + n]);
  const q2 = h.map(([x,y]) => [n-1-y + n, x]);       // rotate 90 CW + shift
  const q3 = h.map(([x,y]) => [n-1-x, n-1-y]);       // 180
  const q4 = h.map(([x,y]) => [y, n-1-x + n]);       // 270 CW
  return [...q1, ...q4.reverse(), ...q3.reverse(), ...q2];
}

// ─── Peano Curve ─────────────────────────────────────────────────────────────
function peano(order) {
  // Iterative: map index i in base-3 to (x,y) with alternating reflections
  const n = Math.pow(3, order);
  const pts = [];
  for (let i = 0; i < n * n; i++) {
    let x = 0, y = 0;
    let t = i;
    let flipX = false, flipY = false;
    for (let s = 1; s < n; s *= 3) {
      const rx = t % 3;
      t = Math.floor(t / 3);
      const ry = t % 3;
      t = Math.floor(t / 3);
      const lx = flipX ? 2 - rx : rx;
      const ly = flipY ? 2 - ry : ry;
      x += lx * s;
      y += ly * s;
      if (lx === 1) flipX = !flipX;
      if (ly === 1) flipY = !flipY;
    }
    pts.push([x, y]);
  }
  return pts;
}

// ─── Gosper / Flowsnake ───────────────────────────────────────────────────────
// L-system approach: A→A-B--B+A++AA+B-, B→+A-BB--B-A++A+B
function gosperLSystem(order) {
  let s = 'A';
  for (let i = 0; i < order; i++) {
    let ns = '';
    for (const c of s) {
      if (c === 'A') ns += 'A-B--B+A++AA+B-';
      else if (c === 'B') ns += '+A-BB--B-A++A+B';
      else ns += c;
    }
    s = ns;
  }
  return s;
}

function gosper(order) {
  const str = gosperLSystem(Math.min(order, 5));
  const pts = [];
  let x = 0, y = 0, angle = 0;
  const step = 1;
  const da = Math.PI / 3;
  pts.push([x, y]);
  for (const c of str) {
    if (c === 'A' || c === 'B') {
      x += step * Math.cos(angle);
      y += step * Math.sin(angle);
      pts.push([x, y]);
    } else if (c === '+') angle += da;
    else if (c === '-') angle -= da;
  }
  return pts;
}

// ─── Generate points ─────────────────────────────────────────────────────────
function generate() {
  const effectiveOrder = Math.min(order, curveType === 'peano' ? 4 : curveType === 'gosper' ? 5 : 7);
  if (curveType === 'hilbert') return hilbert(effectiveOrder);
  if (curveType === 'peano')   return peano(effectiveOrder);
  if (curveType === 'moore')   return moore(effectiveOrder);
  if (curveType === 'gosper')  return gosper(effectiveOrder);
  return hilbert(effectiveOrder);
}

function mapPoints(raw) {
  if (!raw.length) return [];
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [x,y] of raw) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  const pad = Math.min(W, H) * 0.07;
  const scaleX = (W - 2 * pad) / (maxX - minX || 1);
  const scaleY = (H - 2 * pad) / (maxY - minY || 1);
  const scale = Math.min(scaleX, scaleY);
  const ox = (W - (maxX - minX) * scale) / 2 - minX * scale;
  const oy = (H - (maxY - minY) * scale) / 2 - minY * scale;
  return raw.map(([x,y]) => [x * scale + ox, y * scale + oy]);
}

// ─── Color ───────────────────────────────────────────────────────────────────
function getColor(i, total) {
  const t = i / (total - 1);
  if (colorMode === 'mono') return `rgba(68,170,255,0.9)`;
  if (colorMode === 'rainbow') {
    const h = ((t * 360 + loopPhase) % 360);
    return `hsl(${h},90%,62%)`;
  }
  if (colorMode === 'depth') {
    const h = (200 + loopPhase * 0.5) % 360;
    const l = 35 + 35 * Math.sin(t * Math.PI * 4 + loopPhase * 0.04);
    return `hsl(${h},80%,${l}%)`;
  }
  // position: blue→cyan→teal gradient
  const h = (200 + t * 80 + loopPhase * 0.3) % 360;
  return `hsl(${h},85%,${50 + t * 18}%)`;
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function drawBackground() {
  ctx.fillStyle = '#04080f';
  ctx.fillRect(0, 0, W, H);
}

function drawGridLines(mapped) {
  if (!showGrid || !mapped.length) return;
  // Draw a faint square grid behind
  const raw = generate();
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [x,y] of raw) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  if (curveType === 'peano' || curveType === 'hilbert' || curveType === 'moore') {
    const n = curveType === 'peano' ? Math.pow(3, Math.min(order, 4)) : (1 << Math.min(order, 7));
    const mX = (mapped[mapped.length-1][0] + mapped[0][0]) / 2;
    // get step size from first two points
    if (mapped.length > 1) {
      const pad = Math.min(W, H) * 0.07;
      const scaleX = (W - 2 * pad) / (maxX - minX || 1);
      const scaleY = (H - 2 * pad) / (maxY - minY || 1);
      const scale = Math.min(scaleX, scaleY);
      ctx.save();
      ctx.strokeStyle = 'rgba(44,100,180,0.06)';
      ctx.lineWidth = 0.5;
      const ox = (W - (maxX - minX) * scale) / 2 - minX * scale;
      const oy = (H - (maxY - minY) * scale) / 2 - minY * scale;
      const cellW = scale; const cellH = scale;
      for (let i = 0; i <= n; i++) {
        const px = i * cellW + ox + minX * scale;
        ctx.beginPath(); ctx.moveTo(px, oy + minY * scale); ctx.lineTo(px, oy + (maxY+1) * scale); ctx.stroke();
        const py = i * cellH + oy + minY * scale;
        ctx.beginPath(); ctx.moveTo(ox + minX * scale, py); ctx.lineTo(ox + (maxX+1) * scale, py); ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawCurveUpTo(mapped, upTo) {
  if (upTo < 2) return;
  const seg = Math.min(upTo, mapped.length);

  // Glow pass
  if (glowAmt > 0) {
    ctx.save();
    ctx.shadowColor = '#2288ff';
    ctx.shadowBlur = glowAmt;
    ctx.lineWidth = lineW * 0.6;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < seg; i++) {
      ctx.strokeStyle = getColor(i, mapped.length);
      ctx.beginPath();
      ctx.moveTo(mapped[i-1][0], mapped[i-1][1]);
      ctx.lineTo(mapped[i][0],   mapped[i][1]);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Main pass
  ctx.save();
  ctx.lineWidth = lineW;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < seg; i++) {
    ctx.strokeStyle = getColor(i, mapped.length);
    ctx.beginPath();
    ctx.moveTo(mapped[i-1][0], mapped[i-1][1]);
    ctx.lineTo(mapped[i][0],   mapped[i][1]);
    ctx.stroke();
  }
  ctx.restore();

  // Leading dot
  if (upTo < mapped.length) {
    const [hx, hy] = mapped[upTo - 1];
    ctx.save();
    ctx.shadowColor = '#88ccff'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#cceeff';
    ctx.beginPath(); ctx.arc(hx, hy, lineW * 2.2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ─── Animation loop ───────────────────────────────────────────────────────────
let mapped = [];

function startDraw() {
  if (animId) cancelAnimationFrame(animId);
  const raw = generate();
  mapped = mapPoints(raw);
  drawIdx = 1;
  instant = false;
  document.getElementById('iPoints').textContent = mapped.length.toLocaleString();
  document.getElementById('iOrder').textContent = order;
  loop();
}

function loop() {
  if (paused) { animId = requestAnimationFrame(loop); return; }

  drawBackground();
  drawGridLines(mapped);

  const seg = instant ? mapped.length : drawIdx;
  drawCurveUpTo(mapped, seg);

  const pct = Math.round((seg / mapped.length) * 100);
  document.getElementById('iProg').textContent = pct;
  document.getElementById('progfill').style.width = pct + '%';

  if (!instant && drawIdx < mapped.length) {
    drawIdx = Math.min(drawIdx + speed, mapped.length);
  } else if (drawIdx >= mapped.length || instant) {
    // Done — loop animation
    if (loopAnim) {
      loopPhase += 0.4;
      if (loopPhase > 360) loopPhase -= 360;
      // Redraw with updated colors
      drawBackground();
      drawGridLines(mapped);
      drawCurveUpTo(mapped, mapped.length);
    }
    if (!instant && loopAnim) {
      // optionally restart
    }
  }

  animId = requestAnimationFrame(loop);
}

// ─── Controls ─────────────────────────────────────────────────────────────────
function sl(id, vId, prop, fn) {
  const el = document.getElementById(id);
  const vEl = document.getElementById(vId);
  el.addEventListener('input', () => {
    vEl.textContent = el.value;
    fn(parseFloat(el.value));
  });
}

sl('sOrder', 'vOrder', 'order', v => { order = v; startDraw(); });
sl('sSpeed', 'vSpeed', 'speed', v => { speed = v; });
sl('sLine',  'vLine',  'lineW', v => { lineW = v; });
sl('sGlow',  'vGlow',  'glowAmt', v => { glowAmt = v; });

document.getElementById('selColor').addEventListener('change', e => { colorMode = e.target.value; });
document.getElementById('chkGrid').addEventListener('change', e => { showGrid = e.target.checked; });
document.getElementById('chkLoop').addEventListener('change', e => { loopAnim = e.target.checked; });

document.getElementById('btnRedraw').addEventListener('click', () => { instant = false; startDraw(); });
document.getElementById('btnPause').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? 'Resume' : 'Pause';
  this.classList.toggle('active', paused);
});
document.getElementById('btnInstant').addEventListener('click', () => {
  instant = true;
  drawIdx = mapped.length;
});

document.querySelectorAll('[data-curve]').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('[data-curve]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    curveType = this.dataset.curve;
    // Clamp order for curve type
    const orderEl = document.getElementById('sOrder');
    if (curveType === 'peano') { orderEl.max = 4; if (order > 4) { order = 4; orderEl.value = 4; document.getElementById('vOrder').textContent = 4; } }
    else if (curveType === 'gosper') { orderEl.max = 5; if (order > 5) { order = 5; orderEl.value = 5; document.getElementById('vOrder').textContent = 5; } }
    else { orderEl.max = 7; }
    startDraw();
  });
});

// Keyboard shortcuts
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  if (e.code === 'KeyR') startDraw();
  if (e.code === 'KeyI') { instant = true; drawIdx = mapped.length; }
  if (e.code === 'ArrowUp') { order = Math.min(parseInt(document.getElementById('sOrder').max), order + 1); document.getElementById('sOrder').value = order; document.getElementById('vOrder').textContent = order; startDraw(); }
  if (e.code === 'ArrowDown') { order = Math.max(1, order - 1); document.getElementById('sOrder').value = order; document.getElementById('vOrder').textContent = order; startDraw(); }
});

// ─── Start ────────────────────────────────────────────────────────────────────
startDraw();
</script>
</body>
</html>
