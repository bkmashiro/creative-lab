<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#059 Slime Mold — creative-lab</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e0e8ff}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;cursor:crosshair}
#ui{position:fixed;top:16px;left:16px;z-index:10;background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:14px 16px;min-width:232px;font-size:0.82rem}
h1{font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;color:#4a7a4a;margin-bottom:11px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.row label{width:90px;color:#c0c8e0;flex-shrink:0;font-size:0.8rem}
.row input[type=range]{flex:1;accent-color:#66ee66;cursor:pointer}
.val{width:36px;text-align:right;color:#66ee66;font-size:0.74rem;font-variant-numeric:tabular-nums}
.info{color:#556655;font-size:0.74rem;padding:2px 0 4px}
.btn-row{display:flex;gap:5px;margin-top:9px}
button{flex:1;background:rgba(102,238,102,0.09);border:1px solid rgba(102,238,102,0.22);color:#66ee66;border-radius:6px;padding:5px 4px;font-size:0.74rem;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:rgba(102,238,102,0.2);border-color:rgba(102,238,102,0.4)}
button.active{background:rgba(102,238,102,0.28);border-color:rgba(102,238,102,0.55)}
#hint{position:fixed;bottom:14px;left:16px;color:rgba(102,238,102,0.22);font-size:0.68rem;pointer-events:none}
footer{position:fixed;bottom:12px;right:16px;color:rgba(255,255,255,0.22);font-size:0.7rem}
footer a{color:rgba(255,255,255,0.28);text-decoration:none}
footer a:hover{color:rgba(255,255,255,0.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>059 · Slime Mold</h1>
  <div class="info">Physarum polycephalum · 262 144 agents</div>
  <div class="row"><label>Sensor Ang</label><input type="range" id="s-sa" min="5" max="90" value="30" step="1"><span class="val" id="v-sa">30°</span></div>
  <div class="row"><label>Sensor Dist</label><input type="range" id="s-sd" min="2" max="30" value="9" step="1"><span class="val" id="v-sd">9px</span></div>
  <div class="row"><label>Turn Speed</label><input type="range" id="s-ra" min="5" max="90" value="22" step="1"><span class="val" id="v-ra">22°</span></div>
  <div class="row"><label>Step Size</label><input type="range" id="s-ss" min="1" max="40" value="12" step="1"><span class="val" id="v-ss">1.2</span></div>
  <div class="row"><label>Decay</label><input type="range" id="s-decay" min="80" max="99" value="95" step="1"><span class="val" id="v-decay">0.95</span></div>
  <div class="row"><label>Diffuse</label><input type="range" id="s-diff" min="0" max="100" value="60" step="5"><span class="val" id="v-diff">60%</span></div>
  <div class="btn-row">
    <button id="btn-reset">Reset</button>
    <button id="btn-mode">Ring</button>
    <button id="btn-pause">Pause</button>
    <button id="btn-color">Green</button>
  </div>
</div>
<div id="hint">Click/drag to attract agents · Right-click to reset</div>
<footer><a href="https://github.com/bkmashiro/creative-lab">creative-lab</a> · demo 059</footer>

<script>
'use strict';

// ── Canvas & context ─────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;

const gl = canvas.getContext('webgl2', {antialias:false, preserveDrawingBuffer:false});
if (!gl) {
  document.body.innerHTML = '<p style="color:#f88;padding:2em;font-size:1.2rem">WebGL2 is required for this demo.</p>';
  throw 0;
}
if (!gl.getExtension('EXT_color_buffer_float')) {
  document.body.innerHTML = '<p style="color:#f88;padding:2em;font-size:1.2rem">EXT_color_buffer_float not available in this browser.</p>';
  throw 0;
}

// ── Simulation constants ─────────────────────────────────────────────────────
const SIM  = 512;        // trail texture dimension (SIM×SIM)
const AGEN = 512;        // agent texture dimension (AGEN×AGEN)
const N    = AGEN*AGEN;  // 262 144 agents

// ── Runtime parameters ───────────────────────────────────────────────────────
const P = {
  sa: 30*Math.PI/180,    // sensor angle (rad)
  sd: 9,                 // sensor distance (px in sim space)
  ra: 22.5*Math.PI/180,  // rotation amount (rad)
  ss: 1.2,               // step size (px)
  decay: 0.95,           // trail evaporation
  diffuse: 0.60,         // diffusion blend weight
  color: 0,              // display palette index
  spawnMode: 0,          // 0=ring, 1=disk, 2=scatter
  paused: false,
  t: 0
};

// ── Shader source strings ────────────────────────────────────────────────────
// Shared quad vertex shader — attribute at location 0
const QUAD_VS = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUV;
void main(){ vUV=aPos*.5+.5; gl_Position=vec4(aPos,0.,1.); }`;

// Agent update: sense trail → compute new heading → move
const AGENT_FS = `#version 300 es
precision highp float;
uniform sampler2D uAgents, uTrail;
uniform float uSA, uSD, uRA, uSS, uTime;
uniform vec2  uSim;
out vec4 oAgent;

// Low-discrepancy hash for pseudo-random
float hash(vec2 p, float t) {
  p  = fract(p * vec2(127.1, 311.7) + t * 0.031);
  p += dot(p, p + 19.31);
  return fract(p.x * p.y * 3758.53);
}

float sampleTrail(vec2 pos) {
  return texture(uTrail, fract(pos / uSim)).r;
}

void main(){
  vec4  ag  = texelFetch(uAgents, ivec2(gl_FragCoord.xy), 0);
  vec2  pos = ag.xy;
  float ang = ag.z;

  // Rotate sensor vectors by ±uSA around current heading
  float ca = cos(ang), sa = sin(ang);
  float cs = cos(uSA), ss_ = sin(uSA);
  vec2 fw = vec2(ca,  sa);
  vec2 lf = vec2(ca*cs - sa*ss_, sa*cs + ca*ss_);
  vec2 rt = vec2(ca*cs + sa*ss_, sa*cs - ca*ss_);

  float fC = sampleTrail(pos + fw*uSD);
  float fL = sampleTrail(pos + lf*uSD);
  float fR = sampleTrail(pos + rt*uSD);

  float rng = hash(pos, uTime);

  // Classic Physarum steering logic
  if (fC >= fL && fC >= fR) {
    // strongest ahead — continue straight
  } else if (fL > fR) {
    ang += uRA;
  } else if (fR > fL) {
    ang -= uRA;
  } else {
    // tied flanks — random jitter
    ang += (rng > .5 ? 1. : -1.) * uRA;
  }

  // Step forward + wrap torus boundaries
  pos = mod(pos + vec2(cos(ang), sin(ang)) * uSS + uSim, uSim);
  oAgent = vec4(pos, ang, 1.);
}`;

// Trail diffusion + evaporation
const DIFFUSE_FS = `#version 300 es
precision highp float;
uniform sampler2D uTrail;
uniform float uDecay, uDiff;
in vec2 vUV;
out vec4 oTrail;
void main(){
  vec2 px = 1. / vec2(textureSize(uTrail, 0));
  float center = texture(uTrail, vUV).r;
  float blur = 0.;
  for (int dy=-1;dy<=1;dy++)
    for (int dx=-1;dx<=1;dx++)
      blur += texture(uTrail, vUV + vec2(dx,dy)*px).r;
  blur /= 9.;
  float v = mix(center, blur, uDiff) * uDecay;
  oTrail = vec4(v, 0., 0., 1.);
}`;

// Deposit: draw each agent as a GL_POINT into the trail texture
const DEPOSIT_VS = `#version 300 es
uniform highp sampler2D uAgents;
uniform vec2 uSim;
void main(){
  int id = gl_VertexID;
  vec4 ag = texelFetch(uAgents, ivec2(id % ${AGEN}, id / ${AGEN}), 0);
  // Map sim coords to NDC
  gl_Position  = vec4(ag.xy / uSim * 2. - 1., 0., 1.);
  gl_PointSize = 1.;
}`;

const DEPOSIT_FS = `#version 300 es
precision mediump float;
out vec4 oDeposit;
// Each agent deposits a small fixed amount of chemo-attractant
void main(){ oDeposit = vec4(0.05, 0., 0., 1.); }`;

// Display: tonemap trail + apply color palette
const DISPLAY_FS = `#version 300 es
precision highp float;
uniform sampler2D uTrail;
uniform int uColorMode;
in vec2 vUV;
out vec4 oColor;

// Explicit 4-stop color ramps
vec3 green(float t){
  if(t<.2)  return mix(vec3(0.),          vec3(.0,.12,.02),     t/.2);
  if(t<.5)  return mix(vec3(.0,.12,.02),  vec3(.04,.65,.12),    (t-.2)/.3);
  if(t<.8)  return mix(vec3(.04,.65,.12), vec3(.25,.95,.38),    (t-.5)/.3);
              return mix(vec3(.25,.95,.38),vec3(.82,1.,.90),     (t-.8)/.2);
}
vec3 heat(float t){
  if(t<.25) return mix(vec3(0.),          vec3(.28,.03,.03),    t/.25);
  if(t<.5)  return mix(vec3(.28,.03,.03), vec3(.82,.18,.0),     (t-.25)/.25);
  if(t<.75) return mix(vec3(.82,.18,.0),  vec3(1.,.68,.06),     (t-.5)/.25);
              return mix(vec3(1.,.68,.06), vec3(1.,1.,.88),      (t-.75)/.25);
}
vec3 galaxy(float t){
  if(t<.25) return mix(vec3(0.),          vec3(.02,.04,.22),    t/.25);
  if(t<.5)  return mix(vec3(.02,.04,.22), vec3(.08,.18,.82),    (t-.25)/.25);
  if(t<.75) return mix(vec3(.08,.18,.82), vec3(.58,.12,.9),     (t-.5)/.25);
              return mix(vec3(.58,.12,.9), vec3(1.,.82,1.),      (t-.75)/.25);
}
vec3 amber(float t){
  if(t<.2)  return mix(vec3(0.),           vec3(.18,.06,.0),    t/.2);
  if(t<.5)  return mix(vec3(.18,.06,.0),   vec3(.72,.38,.0),    (t-.2)/.3);
  if(t<.8)  return mix(vec3(.72,.38,.0),   vec3(1.,.78,.1),     (t-.5)/.3);
              return mix(vec3(1.,.78,.1),   vec3(1.,1.,.82),     (t-.8)/.2);
}

void main(){
  float v = texture(uTrail, vUV).r;
  // Reinhard-style tonemap: maps [0,∞) → [0,1)
  float t = v / (v + 0.55);
  vec3 col;
  if      (uColorMode == 0) col = green(t);
  else if (uColorMode == 1) col = heat(t);
  else if (uColorMode == 2) col = galaxy(t);
  else                      col = amber(t);
  oColor = vec4(clamp(col, 0., 1.), 1.);
}`;

// ── Shader helpers ───────────────────────────────────────────────────────────
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('Shader error:\n' + gl.getShaderInfoLog(s) + '\n\n' + src);
  return s;
}
function makeProgram(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER,   vsSrc));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error('Link error: ' + gl.getProgramInfoLog(p));
  return p;
}

// ── Compile all programs ─────────────────────────────────────────────────────
const pAgent   = makeProgram(QUAD_VS,    AGENT_FS);
const pDiffuse = makeProgram(QUAD_VS,    DIFFUSE_FS);
const pDeposit = makeProgram(DEPOSIT_VS, DEPOSIT_FS);
const pDisplay = makeProgram(QUAD_VS,    DISPLAY_FS);

// Cache uniform locations
function uloc(p, n) { return gl.getUniformLocation(p, n); }
const UA = { agents:uloc(pAgent,'uAgents'), trail:uloc(pAgent,'uTrail'),
             SA:uloc(pAgent,'uSA'), SD:uloc(pAgent,'uSD'), RA:uloc(pAgent,'uRA'),
             SS:uloc(pAgent,'uSS'), time:uloc(pAgent,'uTime'), sim:uloc(pAgent,'uSim') };
const UD = { trail:uloc(pDiffuse,'uTrail'), decay:uloc(pDiffuse,'uDecay'), diff:uloc(pDiffuse,'uDiff') };
const UP = { agents:uloc(pDeposit,'uAgents'), sim:uloc(pDeposit,'uSim') };
const UV = { trail:uloc(pDisplay,'uTrail'), color:uloc(pDisplay,'uColorMode') };

// ── VAOs ─────────────────────────────────────────────────────────────────────
// Quad VAO — shared by all full-screen fragment passes (attribute loc 0)
const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

// Empty VAO — deposit pass uses only gl_VertexID, no vertex buffers needed
const emptyVAO = gl.createVertexArray();

// ── Texture + FBO factories ──────────────────────────────────────────────────
function makeF32Tex(w, h, data, filter, wrap) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter || gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter || gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap  || gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap  || gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, data || null);
  return t;
}
function makeFBO(tex) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
    console.warn('FBO incomplete');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return f;
}

// ── Agent initialisation ─────────────────────────────────────────────────────
function buildAgentData(mode) {
  const d = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const a   = Math.random() * Math.PI * 2;
    let px, py, heading;
    if (mode === 0) {
      // Ring: agents on a circle, headings pointing inward
      const r = SIM * 0.35;
      px = SIM*0.5 + Math.cos(a) * r;
      py = SIM*0.5 + Math.sin(a) * r;
      heading = a + Math.PI + (Math.random()-0.5) * 0.5;
    } else if (mode === 1) {
      // Disk: agents in a filled disk, random headings
      const r = Math.sqrt(Math.random()) * SIM * 0.4;
      px = SIM*0.5 + Math.cos(a) * r;
      py = SIM*0.5 + Math.sin(a) * r;
      heading = Math.random() * Math.PI * 2;
    } else {
      // Scatter: uniform random across whole sim
      px = Math.random() * SIM;
      py = Math.random() * SIM;
      heading = Math.random() * Math.PI * 2;
    }
    d[i*4  ] = px;
    d[i*4+1] = py;
    d[i*4+2] = heading;
    d[i*4+3] = 1;
  }
  return d;
}

// Ping-pong: two agent textures + two trail textures + FBOs
let agentTex = [makeF32Tex(AGEN, AGEN, buildAgentData(0)), makeF32Tex(AGEN, AGEN)];
let trailTex = [makeF32Tex(SIM, SIM, null, gl.LINEAR, gl.REPEAT),
                makeF32Tex(SIM, SIM, null, gl.LINEAR, gl.REPEAT)];
let agentFBO  = agentTex.map(makeFBO);
let trailFBO  = trailTex.map(makeFBO);

let cur = 0;

// ── Helpers ──────────────────────────────────────────────────────────────────
function bindTex(unit, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}
function drawQuad() {
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindVertexArray(null);
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function reset() {
  const agData = buildAgentData(P.spawnMode);
  gl.bindTexture(gl.TEXTURE_2D, agentTex[0]);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, AGEN, AGEN, gl.RGBA, gl.FLOAT, agData);
  gl.bindTexture(gl.TEXTURE_2D, agentTex[1]);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, AGEN, AGEN, gl.RGBA, gl.FLOAT, new Float32Array(N*4));
  const zero = new Float32Array(SIM*SIM*4);
  trailTex.forEach(t => {
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, SIM, SIM, gl.RGBA, gl.FLOAT, zero);
  });
  cur = 0;
  P.t = 0;
}

// ── Main render loop ─────────────────────────────────────────────────────────
function frame() {
  requestAnimationFrame(frame);
  if (P.paused) return;

  const nx = 1 - cur;

  // ── Pass 1: Move agents ──────────────────────────────────────────────────
  // Reads: agentTex[cur] + trailTex[cur]
  // Writes: agentFBO[nx] → agentTex[nx]
  gl.useProgram(pAgent);
  gl.bindFramebuffer(gl.FRAMEBUFFER, agentFBO[nx]);
  gl.viewport(0, 0, AGEN, AGEN);
  bindTex(0, agentTex[cur]); gl.uniform1i(UA.agents, 0);
  bindTex(1, trailTex[cur]); gl.uniform1i(UA.trail,  1);
  gl.uniform1f(UA.SA,   P.sa);
  gl.uniform1f(UA.SD,   P.sd);
  gl.uniform1f(UA.RA,   P.ra);
  gl.uniform1f(UA.SS,   P.ss);
  gl.uniform1f(UA.time, P.t);
  gl.uniform2f(UA.sim,  SIM, SIM);
  drawQuad();

  // ── Pass 2: Diffuse + decay trail ────────────────────────────────────────
  // Reads: trailTex[cur]
  // Writes: trailFBO[nx] → trailTex[nx]
  gl.useProgram(pDiffuse);
  gl.bindFramebuffer(gl.FRAMEBUFFER, trailFBO[nx]);
  gl.viewport(0, 0, SIM, SIM);
  bindTex(0, trailTex[cur]); gl.uniform1i(UD.trail, 0);
  gl.uniform1f(UD.decay, P.decay);
  gl.uniform1f(UD.diff,  P.diffuse);
  drawQuad();

  // ── Pass 3: Deposit agents (additive blend) onto trail ───────────────────
  // Reads: agentTex[nx] (just written — safe, it's not the render target)
  // Writes: trailFBO[nx] (still bound) with additive blending
  gl.useProgram(pDeposit);
  // trailFBO[nx] is already bound; just switch blend mode
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  bindTex(0, agentTex[nx]); gl.uniform1i(UP.agents, 0);
  gl.uniform2f(UP.sim, SIM, SIM);
  gl.bindVertexArray(emptyVAO);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.bindVertexArray(null);
  gl.disable(gl.BLEND);

  // ── Pass 4: Display trail to screen ─────────────────────────────────────
  gl.useProgram(pDisplay);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  bindTex(0, trailTex[nx]); gl.uniform1i(UV.trail, 0);
  gl.uniform1i(UV.color, P.color);
  drawQuad();

  cur = nx;
  P.t += 1/60;
}

// ── UI ────────────────────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const el = id => $(id);

function setSlider(sid, vid, setter, fmt) {
  const s = el('s-' + sid), v = el('v-' + vid);
  s.addEventListener('input', () => { setter(+s.value); v.textContent = fmt(+s.value); });
}
setSlider('sa',    'sa',    v => P.sa      = v*Math.PI/180, v => v+'°');
setSlider('sd',    'sd',    v => P.sd      = v,             v => v+'px');
setSlider('ra',    'ra',    v => P.ra      = v*Math.PI/180, v => v+'°');
setSlider('ss',    'ss',    v => P.ss      = v/10,          v => (v/10).toFixed(1));
setSlider('decay', 'decay', v => P.decay   = v/100,         v => (v/100).toFixed(2));
setSlider('diff',  'diff',  v => P.diffuse = v/100,         v => Math.round(v)+'%');

const spawnModeNames  = ['Ring', 'Disk', 'Random'];
const colorModeNames  = ['Green', 'Heat', 'Galaxy', 'Amber'];

el('btn-reset').addEventListener('click', reset);

el('btn-mode').addEventListener('click', function() {
  P.spawnMode = (P.spawnMode + 1) % 3;
  this.textContent = spawnModeNames[P.spawnMode];
  reset();
});

el('btn-pause').addEventListener('click', function() {
  P.paused = !P.paused;
  this.classList.toggle('active', P.paused);
  this.textContent = P.paused ? 'Resume' : 'Pause';
});

el('btn-color').addEventListener('click', function() {
  P.color = (P.color + 1) % 4;
  this.textContent = colorModeNames[P.color];
});

// ── Mouse: click to inject attractant ────────────────────────────────────────
let pointerDown = false;
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  pointerDown = true;
  injectAttractant(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', e => {
  if (pointerDown) injectAttractant(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup',   () => pointerDown = false);
canvas.addEventListener('pointerout',  () => pointerDown = false);
canvas.addEventListener('contextmenu', e => { e.preventDefault(); reset(); });

function injectAttractant(cx, cy) {
  // Map display coords → sim coords (y is flipped in WebGL)
  const sx = (cx / canvas.width)          * SIM;
  const sy = (1 - cy / canvas.height)     * SIM;
  const R  = 14;
  const patch = new Float32Array(R * R * 4);
  for (let i = 0; i < R*R; i++) {
    // Gaussian falloff
    const px = (i % R) - R/2 + 0.5;
    const py = Math.floor(i/R) - R/2 + 0.5;
    const v  = 8.0 * Math.exp(-(px*px + py*py) / (R*R/8));
    patch[i*4] = v;
  }
  const ox = Math.max(0, Math.min(SIM - R, Math.round(sx - R/2)));
  const oy = Math.max(0, Math.min(SIM - R, Math.round(sy - R/2)));
  // Write to current trail texture so agents sense it next frame
  gl.bindTexture(gl.TEXTURE_2D, trailTex[cur]);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, ox, oy, R, R, gl.RGBA, gl.FLOAT, patch);
}

// ── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
});

// ── Boot ──────────────────────────────────────────────────────────────────────
frame();
</script>
