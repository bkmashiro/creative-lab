<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#067 Sound Visualizer Shader — creative-lab</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#060810;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e6edf3}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh}
#ui{position:fixed;top:16px;left:16px;z-index:10;background:rgba(6,8,16,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 16px;min-width:234px;font-size:0.82rem}

.row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.row label{width:92px;color:#8b949e;flex-shrink:0;font-size:0.75rem}
.row input[type=range]{flex:1;accent-color:#58a6ff;cursor:pointer;height:3px}
.val{width:38px;text-align:right;color:#58a6ff;font-size:0.72rem;font-variant-numeric:tabular-nums}

button{flex:1;min-width:44px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#c9d1d9;border-radius:6px;padding:5px 4px;font-size:0.71rem;cursor:pointer;transition:background .12s,border-color .12s}
button:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.22)}
button.active{background:rgba(88,166,255,0.18);border-color:rgba(88,166,255,0.45);color:#79b8ff}
#status{font-size:0.73rem;margin-bottom:7px;padding:5px 8px;border-radius:6px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#8b949e}
#status.ok{color:#56d364;border-color:rgba(86,211,100,0.25);background:rgba(86,211,100,0.05)}

</style>

<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>067 · Sound Visualizer Shader</h1>
  <div class="info">Mic → FFT → real-time GLSL fragment shader</div>
  <div id="status">🎤 Demo mode (no mic) — click Enable Mic</div>
  <div class="btn-row">
    <button id="btn-mic">Enable Mic</button>
  </div>
  <div class="sep"></div>
  <div class="row">
    <label>Gain</label>
    <input type="range" id="sl-gain" min="0.5" max="6" step="0.1" value="2.0">
    <span class="val" id="v-gain">2.0</span>
  </div>
  <div class="row">
    <label>Smoothing</label>
    <input type="range" id="sl-smooth" min="0.05" max="0.97" step="0.01" value="0.80">
    <span class="val" id="v-smooth">0.80</span>
  </div>
  <div class="row">
    <label>Brightness</label>
    <input type="range" id="sl-bright" min="0.3" max="2.5" step="0.05" value="1.0">
    <span class="val" id="v-bright">1.00</span>
  </div>
  <div class="sep"></div>
  <div class="statrow">Mode <span id="v-mode">Radial</span></div>
  <div class="statrow">Bass level <span id="v-bass">—</span></div>
  <div class="statrow">Peak freq <span id="v-peak">—</span></div>
  <div class="statrow">FPS <span id="v-fps">—</span></div>
  <div class="sep"></div>
  <div class="btn-row">
    <button id="btn-radial" class="active">Radial</button>
    <button id="btn-bars">Bars</button>
    <button id="btn-tunnel">Tunnel</button>
  </div>
</div>
<div id="hint">Demo mode: synthetic audio · Enable Mic for live input</div>
<footer><a href="https://github.com/bkmashiro/creative-lab">creative-lab</a> · demo 067</footer>

<script>
// ── WebGL init ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false })
        || canvas.getContext('experimental-webgl', { antialias: false, alpha: false });
if (!gl) { document.body.innerHTML = '<p style="color:#f00;padding:2rem">WebGL not supported</p>'; }

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── Shader sources ────────────────────────────────────────────────────────────
const VS = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

// Shared GLSL utilities (injected into each FS)
const GLSL_UTIL = `
precision mediump float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_gain;
uniform float u_bass;
uniform float u_bright;
uniform sampler2D u_fft;
uniform sampler2D u_wave;
#define PI  3.14159265358979
#define TAU 6.28318530717959

vec3 hsv(float h, float s, float v) {
  vec3 p = abs(fract(vec3(h) + vec3(1.0, 2.0/3.0, 1.0/3.0)) * 6.0 - 3.0);
  return v * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), s);
}

float fft(float t) {
  return texture2D(u_fft, vec2(clamp(t, 0.001, 0.999), 0.5)).r * u_gain;
}

float wave(float t) {
  return texture2D(u_wave, vec2(clamp(t, 0.001, 0.999), 0.5)).r * 2.0 - 1.0;
}

vec3 tonemap(vec3 c) {
  c *= u_bright;
  return pow(clamp(c / (c + 1.0) * 1.2, 0.0, 1.0), vec3(1.0/2.2));
}
`;

// ── Radial shader ─────────────────────────────────────────────────────────────
const FS_RADIAL = GLSL_UTIL + `
void main() {
  vec2 uv  = (gl_FragCoord.xy - u_res * 0.5) / min(u_res.x, u_res.y);
  float r  = length(uv);
  float th = atan(uv.y, uv.x);          // -PI..PI
  float t  = th / TAU + 0.5;            // 0..1 around circle

  // ── Background nebula ──
  float bg = u_bass * 0.2;
  vec3 col = vec3(bg * 0.25, bg * 0.08, bg * 0.45) * 0.6;

  // ── Waveform ring (r ≈ 0.28) ──
  float wR   = 0.28 + wave(t) * 0.07;
  float wGlo = exp(-abs(r - wR) * 95.0) * 0.75;
  col += hsv(t * 0.45 + u_time * 0.08, 0.75, 1.0) * wGlo;

  // ── FFT spectrum bars (outward from r=0.34) ──
  float inner = 0.34;
  float amp   = fft(t * 0.85);          // use 0..85% of spectrum (ignore high noise)
  float outer = inner + amp * 0.52;

  if (r > inner && r < outer + 0.01) {
    float pos  = (r - inner) / max(outer - inner, 0.001);
    float hue  = t * 0.72 + u_bass * 0.12 + u_time * 0.04;
    vec3 barC  = hsv(hue, 0.88, 1.0);
    float fade = (1.0 - pos * 0.7) * step(r, outer);
    col  += barC * fade * 1.2;
    // leading-edge glow
    float topG = exp(-(outer - r) * 60.0) * amp;
    col  += barC * topG * 1.8;
  }

  // ── Outer bloom spill ──
  float spill = exp(-(r - (inner + amp * 0.52)) * 18.0) * amp * 0.5;
  if (r > inner) col += hsv(t * 0.72 + u_time * 0.04, 0.65, 1.0) * max(spill, 0.0);

  // ── Center pulse ──
  float cp = exp(-r * 11.0) * (0.35 + u_bass * 0.9);
  col += hsv(u_time * 0.12, 0.55, 1.0) * cp;

  // ── Beat ring ──
  float br  = 0.25 + u_bass * 0.04;
  float brG = exp(-abs(r - br) * 35.0) * u_bass * 0.7;
  col += hsv(u_time * 0.09 + 0.58, 0.8, 1.0) * brG;

  gl_FragColor = vec4(tonemap(col), 1.0);
}
`;

// ── Bars shader ───────────────────────────────────────────────────────────────
const FS_BARS = GLSL_UTIL + `
void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  float x = uv.x;
  float y = uv.y;

  // Mirror x for symmetry
  float sx  = x < 0.5 ? x * 2.0 : (1.0 - x) * 2.0;
  float amp = fft(sx * 0.82);

  float baseY   = 0.08;
  float barTop  = baseY + amp * 0.88;
  float hue     = x * 0.65 + u_time * 0.04 + u_bass * 0.1;

  // Background gradient
  vec3 col = vec3(0.015, 0.01, 0.03) + vec3(0.02, 0.0, 0.04) * u_bass;

  // Bar fill
  if (y > baseY && y < barTop) {
    float pos  = (y - baseY) / max(barTop - baseY, 0.001);
    vec3 barC  = hsv(hue, 0.9, 1.0);
    float fade = 1.0 - pos * 0.55;
    col = barC * fade;
    // top bloom
    float topB = exp(-(barTop - y) * 55.0);
    col += barC * topB * 0.9;
  }

  // Top glow spill above bar
  float spill = y - barTop;
  if (spill > 0.0 && spill < 0.12) {
    col += hsv(hue, 0.72, 1.0) * exp(-spill * 85.0) * amp * 1.2;
  }

  // Floor reflection (mirrored, dimmed)
  float ry = baseY - (y - baseY);
  if (ry > baseY - amp * 0.88 && ry < baseY) {
    float pos2 = (baseY - y) / max(amp * 0.88, 0.001);
    col += hsv(hue, 0.9, 0.35) * (1.0 - pos2 * 1.2) * step(y, baseY);
  }

  // Waveform overlay (center)
  float wY   = 0.5 + wave(x) * 0.14;
  float wDst = abs(y - wY);
  float wG   = exp(-wDst * u_res.y * 0.14);
  col += hsv(x * 0.4 + 0.5 + u_time * 0.1, 0.65, 1.0) * wG * 0.85;

  // Subtle grid
  float gx = step(0.49, abs(fract(x * 24.0) - 0.5));
  float gy = step(0.47, abs(fract(y * 12.0) - 0.5));
  col += vec3(0.025) * min(gx, gy);

  // Beat flash
  col += vec3(0.02, 0.01, 0.04) * u_bass * u_bass;

  gl_FragColor = vec4(tonemap(col), 1.0);
}
`;

// ── Tunnel shader ─────────────────────────────────────────────────────────────
const FS_TUNNEL = GLSL_UTIL + `
void main() {
  vec2 uv  = (gl_FragCoord.xy - u_res * 0.5) / min(u_res.x, u_res.y);
  float r  = max(length(uv), 0.001);
  float th = atan(uv.y, uv.x);
  float t  = th / TAU + 0.5;           // 0..1

  // Tunnel depth — inverse radial distance creates perspective
  float depth = 0.22 / r;
  float speed = 0.28 + u_bass * 0.55;
  float d     = depth + u_time * speed;

  // Sample FFT at angle + slight depth twist
  float amp  = fft(fract(t + d * 0.018));
  float amp2 = fft(fract(t * 2.0 + u_time * 0.04));

  // ── Tunnel rings ──
  float ring  = fract(d);                            // 0..1 within each ring
  float rBand = 0.08 + amp * 0.35;                   // width of lit band
  float rGlo  = exp(-abs(ring - 0.1) / rBand) * amp; // glow at leading face
  float hue1  = t + d * 0.06 + u_time * 0.07;
  vec3 col    = hsv(hue1, 0.92, 1.0) * rGlo * 1.6;

  // ── Radial spikes along ring edges ──
  float spikes = abs(fract(t * 48.0) - 0.5) * 2.0;  // creates 48 teeth
  float spike  = (1.0 - spikes) * amp2 * 0.5;
  float hue2   = t * 0.8 + u_time * 0.11;
  col += hsv(hue2, 0.85, 1.0) * spike * exp(-ring * 4.0);

  // ── Hexagonal grid overlay ──
  vec2 gp  = vec2(t * 16.0, depth * 3.0 + u_time * speed * 3.0);
  float gx = abs(fract(gp.x) - 0.5);
  float gy = abs(fract(gp.y) - 0.5);
  float grid = min(gx, gy);
  col += hsv(hue1 + 0.33, 0.7, 0.6) * (1.0 - smoothstep(0.45, 0.5, grid)) * 0.12;

  // ── Center bright core ──
  col += hsv(u_time * 0.15, 0.5, 1.0) * exp(-r * 7.0) * (0.4 + u_bass * 0.8);

  // ── Edge fog ──
  col *= smoothstep(1.2, 0.15, r);

  // Beat flash vignette
  col += vec3(0.04, 0.01, 0.08) * u_bass * u_bass * exp(-r * 4.0);

  gl_FragColor = vec4(tonemap(col), 1.0);
}
`;

// ── Shader compilation ────────────────────────────────────────────────────────
function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error('Shader error:', gl.getShaderInfoLog(s));
  return s;
}

function makeProgram(fsSrc) {
  const vs = compileShader(VS, gl.VERTEX_SHADER);
  const fs = compileShader(fsSrc, gl.FRAGMENT_SHADER);
  const p  = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    console.error('Program error:', gl.getProgramInfoLog(p));
  return p;
}

const progs = {
  radial: makeProgram(FS_RADIAL),
  bars:   makeProgram(FS_BARS),
  tunnel: makeProgram(FS_TUNNEL),
};

// ── Fullscreen quad ───────────────────────────────────────────────────────────
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

// ── Textures (FFT data and waveform) ─────────────────────────────────────────
const BIN_COUNT = 512; // analyser.frequencyBinCount = fftSize/2

function makeTex() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, BIN_COUNT, 1, 0,
                gl.LUMINANCE, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

const fftTex  = makeTex();
const waveTex = makeTex();

function uploadTex(tex, data) {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, BIN_COUNT, 1,
                   gl.LUMINANCE, gl.UNSIGNED_BYTE, data);
}

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx = null, analyser = null, micStream = null;
let fftData  = new Uint8Array(BIN_COUNT);
let waveData = new Uint8Array(BIN_COUNT);

async function enableMic() {
  const statusEl = document.getElementById('status');
  statusEl.className = '';
  statusEl.textContent = '⏳ Requesting microphone…';
  try {
    const stream  = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx      = new (window.AudioContext || window.webkitAudioContext)();
    analyser      = audioCtx.createAnalyser();
    analyser.fftSize               = BIN_COUNT * 2;   // → frequencyBinCount = BIN_COUNT
    analyser.smoothingTimeConstant = parseFloat(document.getElementById('sl-smooth').value);
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    micStream = stream;
    fftData   = new Uint8Array(analyser.frequencyBinCount);
    waveData  = new Uint8Array(BIN_COUNT);
    statusEl.className   = 'ok';
    statusEl.textContent = '✓ Mic active — listening';
    document.getElementById('btn-mic').textContent = 'Stop Mic';
    document.getElementById('btn-mic').onclick = stopMic;
    document.getElementById('hint').textContent = 'Speak or play music near the mic';
  } catch (e) {
    statusEl.className   = 'err';
    statusEl.textContent = '✗ ' + (e.message || 'Microphone denied');
  }
}

function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx)  audioCtx.close();
  analyser = audioCtx = micStream = null;
  fftData  = new Uint8Array(BIN_COUNT);
  waveData = new Uint8Array(BIN_COUNT);
  document.getElementById('status').className   = '';
  document.getElementById('status').textContent = '🎤 Demo mode — click Enable Mic';
  document.getElementById('btn-mic').textContent = 'Enable Mic';
  document.getElementById('btn-mic').onclick = enableMic;
  document.getElementById('hint').textContent = 'Demo mode: synthetic audio · Enable Mic for live input';
}

document.getElementById('btn-mic').onclick = enableMic;

// ── Controls ──────────────────────────────────────────────────────────────────
let gain   = 2.0;
let bright = 1.0;
let mode   = 'radial';

document.getElementById('sl-gain').oninput = e => {
  gain = parseFloat(e.target.value);
  document.getElementById('v-gain').textContent = gain.toFixed(1);
};
document.getElementById('sl-smooth').oninput = e => {
  const v = parseFloat(e.target.value);
  document.getElementById('v-smooth').textContent = v.toFixed(2);
  if (analyser) analyser.smoothingTimeConstant = v;
};
document.getElementById('sl-bright').oninput = e => {
  bright = parseFloat(e.target.value);
  document.getElementById('v-bright').textContent = bright.toFixed(2);
};

function setMode(m) {
  mode = m;
  document.getElementById('v-mode').textContent = m.charAt(0).toUpperCase() + m.slice(1);
  ['radial','bars','tunnel'].forEach(n =>
    document.getElementById('btn-' + n).classList.toggle('active', n === m));
}
document.getElementById('btn-radial').onclick = () => setMode('radial');
document.getElementById('btn-bars').onclick   = () => setMode('bars');
document.getElementById('btn-tunnel').onclick = () => setMode('tunnel');

// ── Demo mode: synthetic audio ────────────────────────────────────────────────
// Generates a plausible-looking spectrum to show off the shader without a mic
function synthAudio(time) {
  for (let i = 0; i < BIN_COUNT; i++) {
    const f = i / BIN_COUNT;
    // Decaying spectral envelope + animated frequency bands
    const env   = Math.exp(-f * 3.2) * 220;
    const kick  = Math.exp(-Math.abs(f - 0.04) * 60) * 160 * (0.5 + 0.5 * Math.sin(time * 2.1));
    const snare = Math.exp(-Math.abs(f - 0.18) * 90) * 120 * (0.5 + 0.5 * Math.sin(time * 3.7 + 1));
    const harm  = Math.exp(-Math.abs(f - 0.35) * 80) * 100 * (0.5 + 0.5 * Math.sin(time * 5.3));
    const noise = Math.random() * 12;
    fftData[i] = Math.min(255, Math.max(0, env + kick + snare + harm + noise) | 0);
  }
  for (let i = 0; i < BIN_COUNT; i++) {
    const f  = i / BIN_COUNT;
    const v  = Math.sin(f * 14 + time * 6.2) * 0.35
             + Math.sin(f * 31 + time * 3.1) * 0.15
             + Math.sin(f * 7  + time * 9.0) * 0.10;
    waveData[i] = Math.min(255, Math.max(0, ((v + 1) * 0.5 * 255) | 0));
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
const unifCache = {};
function getUL(prog, name) {
  const key = prog + ':' + name;
  if (!unifCache[key]) unifCache[key] = gl.getUniformLocation(prog, name);
  return unifCache[key];
}

function setUniforms(prog, time, bass) {
  gl.uniform2f (getUL(prog,'u_res'),    canvas.width, canvas.height);
  gl.uniform1f (getUL(prog,'u_time'),   time);
  gl.uniform1f (getUL(prog,'u_gain'),   gain);
  gl.uniform1f (getUL(prog,'u_bass'),   bass);
  gl.uniform1f (getUL(prog,'u_bright'), bright);
  gl.uniform1i (getUL(prog,'u_fft'),    0);
  gl.uniform1i (getUL(prog,'u_wave'),   1);
}

// Pre-cache all uniform locations
Object.values(progs).forEach(p => {
  gl.useProgram(p);
  ['u_res','u_time','u_gain','u_bass','u_bright','u_fft','u_wave'].forEach(n =>
    getUL(p, n));
});

let t0 = performance.now(), frameCount = 0, fps = 0;
let lastBass = 0;

function frame(now) {
  requestAnimationFrame(frame);

  // FPS counter
  frameCount++;
  if (now - t0 >= 1000) {
    fps = frameCount; frameCount = 0; t0 = now;
    document.getElementById('v-fps').textContent = fps;
  }

  const time = now * 0.001;

  // Gather audio data
  let bass = 0, peakBin = 0, peakVal = 0;
  if (analyser) {
    analyser.getByteFrequencyData(fftData);
    analyser.getByteTimeDomainData(waveData);
  } else {
    synthAudio(time);
  }

  // Compute bass (first ~80 Hz bins) and peak frequency
  for (let i = 0; i < 10; i++) bass += fftData[i] / 255;
  bass /= 10;
  for (let i = 0; i < BIN_COUNT; i++) {
    if (fftData[i] > peakVal) { peakVal = fftData[i]; peakBin = i; }
  }
  // Smooth bass
  lastBass = lastBass * 0.85 + bass * 0.15;

  // Update UI (throttle to avoid jank)
  if (frameCount % 3 === 0) {
    document.getElementById('v-bass').textContent = (lastBass * 100 | 0) + '%';
    if (analyser) {
      const sampleRate = audioCtx.sampleRate;
      const hz = (peakBin * sampleRate / (BIN_COUNT * 2)) | 0;
      document.getElementById('v-peak').textContent = hz + ' Hz';
    }
  }

  // Upload audio textures
  uploadTex(fftTex,  fftData);
  uploadTex(waveTex, waveData);

  // Draw
  const prog = progs[mode];
  gl.useProgram(prog);

  const posLoc = gl.getAttribLocation(prog, 'a_pos');
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fftTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, waveTex);

  setUniforms(prog, time, lastBass);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

requestAnimationFrame(frame);
</script>
